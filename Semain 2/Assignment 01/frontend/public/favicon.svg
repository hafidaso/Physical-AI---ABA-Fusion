<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9f68" />
      <stop offset="100%" stop-color="#ff7850" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circular disk -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="#050811" stroke="rgba(255,120,80,0.3)" stroke-width="2" />
  
  <!-- Outer glowing loop pathway -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-dasharray="6 4" />
  
  <!-- Robot Chassis Representation -->
  <rect x="34" y="38" width="32" height="24" rx="4" fill="url(#grad)" />
  <rect x="38" y="32" width="24" height="6" rx="2" fill="#111528" />
  
  <!-- Wheels -->
  <circle cx="38" cy="64" r="5" fill="#111" />
  <circle cx="62" cy="64" r="5" fill="#111" />
  
  <!-- Glowing LED -->
  <circle cx="50" cy="42" r="3" fill="#10b981" />
</svg>